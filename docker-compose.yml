services:
  target-server:
    build: ./target-server
    container_name: cod2-testbench-target
    ports:
      - "8091:8080"
    networks:
      - cod2-testbench-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

networks:
  cod2-testbench-net:
    driver: bridge