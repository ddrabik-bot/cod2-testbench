// test.cfg - Minimalna konfiguracja serwera CoD2 do testow CI
set sv_hostname "CoD2 Testbench CI"
set sv_maxclients 16
set sv_rcon_password "test123"
set sv_pure 0
set sv_cheats 1
set sv_fps 20
set sv_maxrate 25000
set sv_minrate 10000
set sv_maxping 500
set sv_floodprotect 1
set sv_allowDownload 1
set g_allowvote 0
set g_gravity 800
set g_speed 190
set g_weaponstay 0
set g_friendlyfire 0
set g_allowkillcam 0
set g_deadchat 1
set g_redSkip 0
set g_blueSkip 0
set timelimit 15
set fraglimit 0
set scorelimit 0
set roundlimit 0
set capturelimit 0

// Ustawienia map
set sv_mapRotation ""
set sv_mapRotationCurrent "map mp_leningrad"
set sv_mapRotationEmptyDelay 0

// Start mapy
map mp_leningrad