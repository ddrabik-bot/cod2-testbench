// ============================================================================
// test.cfg — Konfiguracja uruchomieniowa testow
// ============================================================================
// Uzycie:  exec test.cfg  (w konsoli dedykowanego serwera CoD2)
// ============================================================================

// Zaladuj pliki testow botow (F3.2)
exec "bot_test_setOriginAndAngles.gsc"
exec "bot_test_forceShot.gsc"
exec "bot_test_setWalkValues.gsc"
exec "bot_test_meleeWeapon.gsc"

// Oczekaj na pelne zaladowanie serwera
wait 3

// Uruchom test runner
testRunner

// Wyswietl informacje o zakonczeniu
echo "^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^"
echo "^^ Test execution complete               ^^"
echo "^^ Sprawdz results/test_results.log      ^^"
echo "^^ oraz results/test_report.html       ^^"
echo "^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^"